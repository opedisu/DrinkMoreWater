# Free scheduler for the reminder job.
#
# Vercel's Hobby plan only runs cron jobs once a day, which is useless for
# hydration reminders. GitHub Actions runs this every 15 minutes at no cost.
# On a Vercel Pro plan you can delete this file and rely on vercel.json.
name: Send hydration reminders

on:
    schedule:
        - cron: "*/15 * * * *"
    workflow_dispatch:

jobs:
    remind:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger reminder sweep
              env:
                  APP_URL: ${{ secrets.APP_URL }}
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
              run: |
                  if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
                      echo "APP_URL and CRON_SECRET repository secrets are required."
                      exit 1
                  fi
                  response=$(curl --silent --show-error --fail-with-body \
                      --max-time 60 \
                      --header "Authorization: Bearer $CRON_SECRET" \
                      "$APP_URL/api/cron/reminders")
                  echo "$response"
